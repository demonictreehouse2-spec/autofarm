plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
	maven { url 'https://maven.meteordev.org/releases' }
	maven { url 'https://maven.meteordev.org/snapshots' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Meteor Client 26.3-22 (compile only; install the real jar in your mods folder)
	// orbit is nested inside Meteor's jar, so it is supplied separately for compiling.
	compileOnly files('libs/meteor-client-26_3-22.jar')
	compileOnly files('libs/orbit-0.2.4.jar')
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mc_version": project.minecraft_version
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}
